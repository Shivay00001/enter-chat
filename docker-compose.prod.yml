# ============================================
# EnterChat Production Docker Compose
# ============================================
# Includes: Nginx (reverse proxy + SSL), API Gateway,
# PostgreSQL, Redis, and Certbot (SSL renewal).
#
# Usage:
#   1. Copy infra/env/production.env.example to .env
#   2. Fill in all CHANGE_ME values
#   3. Run: docker compose -f docker-compose.prod.yml up -d
# ============================================

services:
  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:1.27-alpine
    container_name: enterchat-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/var/www/enterchat/web:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - api_gateway
    networks:
      - enterchat-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- SSL Certificate Manager ---
  certbot:
    image: certbot/certbot:latest
    container_name: enterchat-certbot
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"

  # --- API Gateway ---
  api_gateway:
    build:
      context: ./services/api_gateway
      dockerfile: Dockerfile
    container_name: enterchat-api
    restart: always
    env_file:
      - .env
    expose:
      - "3000"
      - "3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - enterchat-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # --- PostgreSQL 16 ---
  db:
    image: postgres:16-alpine
    container_name: enterchat-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-enterchat}
      POSTGRES_USER: ${DB_USER:-enterchat}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    networks:
      - enterchat-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-enterchat} -d ${DB_NAME:-enterchat}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    shm_size: '256mb'
    command:
      - "postgres"
      - "-c" 
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "wal_level=replica"

  # --- Redis 7 ---
  redis:
    image: redis:7-alpine
    container_name: enterchat-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    networks:
      - enterchat-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  certbot-certs:
    driver: local
  certbot-www:
    driver: local

networks:
  enterchat-net:
    driver: bridge
