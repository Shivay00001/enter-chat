# ============================================
# EnterChat Nginx Reverse Proxy Configuration
# ============================================
# Domain mapping, SSL termination, WebSocket upgrade,
# rate limiting, security headers, static serving.

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_media:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

# Upstream backends
upstream api_gateway {
    least_conn;
    server api_gateway:3000;
    # Add more instances for horizontal scaling:
    # server api_gateway_2:3000;
    # server api_gateway_3:3000;
    keepalive 64;
}

upstream ws_gateway {
    # WebSocket sticky sessions via IP hash
    ip_hash;
    server api_gateway:3001;
    # server api_gateway_2:3001;
}

# ============================================
# HTTP → HTTPS redirect
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name enterchat.app www.enterchat.app api.enterchat.app;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================
# Main website — enterchat.app
# ============================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name enterchat.app www.enterchat.app;

    # SSL/TLS
    ssl_certificate /etc/letsencrypt/live/enterchat.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enterchat.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.enterchat.app wss://ws.enterchat.app" always;

    root /var/www/enterchat/web;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Legal pages (served as static HTML)
    location /privacy-policy { try_files /legal/privacy-policy.html =404; }
    location /terms { try_files /legal/terms.html =404; }
    location /delete-account { try_files /legal/delete-account.html =404; }
    location /contact { try_files /legal/contact.html =404; }
}

# ============================================
# API Gateway — api.enterchat.app
# ============================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.enterchat.app;

    ssl_certificate /etc/letsencrypt/live/enterchat.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enterchat.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Request body limits
    client_max_body_size 100M; # Media uploads
    client_body_buffer_size 10M;

    # API routes
    location /v1/ {
        limit_req zone=api_general burst=50 nodelay;

        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # Keepalive
        proxy_set_header Connection "";
    }

    # Auth endpoints — stricter rate limiting
    location /v1/auth/ {
        limit_req zone=api_auth burst=3 nodelay;

        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Media uploads — larger timeout, body size
    location /v1/media/ {
        limit_req zone=api_media burst=5 nodelay;
        client_max_body_size 100M;

        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s; # Long uploads
    }

    # Health checks (no rate limit)
    location /health {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /ready {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# ============================================
# WebSocket — ws.enterchat.app
# ============================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ws.enterchat.app;

    ssl_certificate /etc/letsencrypt/live/enterchat.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enterchat.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # WebSocket upgrade
    location / {
        limit_conn ws_conn 5; # Max 5 WS connections per IP

        proxy_pass http://ws_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s; # 24h — kept alive by heartbeats
        proxy_send_timeout 86400s;
    }
}
