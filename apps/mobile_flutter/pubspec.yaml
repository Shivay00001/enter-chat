name: enterchat
description: EnterChat - Secure, decentralized communication.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  go_router: ^14.0.0
  dio: ^5.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.0
  shimmer: ^3.0.0
  uuid: ^4.4.0
  intl: ^0.19.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.0
  url_launcher: ^6.2.0
  web_socket_channel: ^2.4.0
  pointycastle: ^3.9.0
  flutter_webrtc: ^0.11.2
  flutter_contacts: ^1.1.9
  permission_handler: ^11.3.1
  crypto: ^3.0.3
  supabase_flutter: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
